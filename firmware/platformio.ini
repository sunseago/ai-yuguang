; DeskPulse 固件 —— Waveshare ESP32-S3-Touch-LCD-1.54
; 编译： pio run -d deskpulse/firmware
; 烧录： pio run -d deskpulse/firmware -t upload
; 监视： pio device monitor -b 115200

[env:waveshare_lcd_154]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8：8MB 八线 PSRAM + 16MB Flash
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -O2
  -ffunction-sections
  -fdata-sections

build_unflags = -Os

lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bblanchon/ArduinoJson@^7.0.4

; 固件用不到的部分，关掉可以省 flash
build_src_filter = +<*> -<tools/>
