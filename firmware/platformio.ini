; AI余光 固件 —— 一块固件，两个板级编译目标：
;   waveshare_lcd_154     Waveshare ESP32-S3-Touch-LCD-1.54   （ST7789 240x240）
;   waveshare_amoled_216  Waveshare ESP32-S3-Touch-AMOLED-2.16（CO5300 480x480）
; 编译： pio run -d deskpulse/firmware -e waveshare_lcd_154
; 烧录： PIO_ENV=waveshare_amoled_216 ./flash.sh
; 监视： pio device monitor -b 115200

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8：8MB 八线 PSRAM + 16MB Flash
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions_aiyuguang_16mb.csv

monitor_speed = 115200
upload_speed = 921600

build_unflags = -Os

; 固件用不到的部分，关掉可以省 flash
build_src_filter = +<*> -<tools/>

; 编译前从 bridge/version.json 生成 src/version_gen.h（版本号唯一来源）
extra_scripts = pre:tools/gen_version.py

common_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -O2
  -ffunction-sections
  -fdata-sections

[env:waveshare_lcd_154]
build_flags =
  ${env.common_flags}
  -DBOARD_LCD154

lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bblanchon/ArduinoJson@^7.0.4

[env:waveshare_amoled_216]
build_flags =
  ${env.common_flags}
  -DBOARD_AMOLED216
  -DXPOWERS_CHIP_AXP2101

lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bblanchon/ArduinoJson@^7.0.4
  lewisxhe/SensorLib@^0.5.1
  lewisxhe/XPowersLib@^0.3.3
